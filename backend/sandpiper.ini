[uwsgi]
module = wsgi:app

master = true
; With duckdb, multiple processes cause database lock issues, except when db is
; accessed read-only
processes = 1
threads = 2

; socket = myproject.sock
; chmod-socket = 660
; vacuum = true

die-on-term = true

; Reload worker if its memory usage (RSS) exceeds 1.5 GB.
; This is 75% of the 2GB Kubernetes limit, giving a safety buffer.
; Value is in MiB (Megabytes). 1.5 GB * 1024 MiB/GB = 1536 MiB.
reload-on-rss = 1536

; --- Process Recycling Hygiene ---
; Kills the worker after handling 1000 requests, mitigating small leaks.
max-requests = 1000

; Kills the worker after running for 30 minutes, mitigating slow fragmentation.
max-worker-lifetime = 1800
